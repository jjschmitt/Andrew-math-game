<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Adventure - Fun Math Game!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 Math Adventure! 🌟</h1>
            <div class="score-board">
                <div class="score-item">
                    <span class="label">Score:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">Streak:</span>
                    <span id="streak" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">Level:</span>
                    <span id="level" class="value">1</span>
                </div>
            </div>
        </header>

        <div id="start-screen" class="screen active">
            <h2>Welcome to Math Adventure! 🚀</h2>
            <p>Choose your challenge:</p>
            <div class="difficulty-buttons">
                <button class="difficulty-btn" data-mode="addition">➕ Addition</button>
                <button class="difficulty-btn" data-mode="subtraction">➖ Subtraction</button>
                <button class="difficulty-btn" data-mode="multiplication">✖️ Multiplication</button>
                <button class="difficulty-btn" data-mode="mixed">🎯 Mixed Challenge</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            <div class="question-container">
                <h2 id="question" class="question">5 + 3 = ?</h2>
                <div class="answer-input-container">
                    <input type="number" id="answer-input" placeholder="Type your answer" autocomplete="off">
                    <button id="submit-btn" class="submit-btn">Check Answer!</button>
                </div>
            </div>

            <div id="feedback" class="feedback"></div>

            <div class="options-container" id="options-container">
                <!-- Multiple choice buttons will be generated here -->
            </div>

            <div class="game-controls">
                <button id="skip-btn" class="control-btn">Skip Question</button>
                <button id="hint-btn" class="control-btn">Get Hint</button>
                <button id="quit-btn" class="control-btn quit">Back to Menu</button>
            </div>
        </div>

        <div id="celebration" class="celebration hidden">
            <div class="celebration-content">
                <h2>🎉 Amazing! 🎉</h2>
                <p id="celebration-message"></p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
